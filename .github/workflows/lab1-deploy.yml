name: Lab 1 - Deploy to AWS ECS

on:
  push:
    branches: [main]
    # Запускатися лише коли змінено код Лаби 1 (не терраформ і не README)
    paths:
      - "Lab1/**"
      - "!Lab1/terraform/**"
      - "!Lab1/README.md"
      - ".github/workflows/lab1-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write   # потрібен для OIDC-токена
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: cloudlab1-app
  ECS_CLUSTER: cloudlab1-cluster
  ECS_SERVICE: cloudlab1-service
  TASK_FAMILY: cloudlab1-app
  CONTAINER_NAME: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, без ключів)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image (tag = commit SHA)
        # Контекст збірки — папка Lab1 (там Dockerfile)
        id: build
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" Lab1
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Put new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}
          environment-variables: |
            APP_VERSION=${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
