name: Lab 1-2 - Deploy to AWS ECS

on:
  push:
    branches: [main]
    paths:
      - "Lab1/**"
      - "!Lab1/terraform/**"
      - "!Lab1/docs/**"
      - "!Lab1/loadtest/**"
      - "!Lab1/tests/**"
      - "!Lab1/README.md"
      - ".github/workflows/lab1-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: lab1-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: cloudlab1-app
  ECS_CLUSTER: cloudlab1-cluster
  APP_SERVICE: cloudlab1-service
  APP_FAMILY: cloudlab1-app
  WORKER_SERVICE: cloudlab1-worker
  WORKER_FAMILY: cloudlab1-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (tag = commit SHA)
        id: build
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" Lab1
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current task definitions
        run: |
          aws ecs describe-task-definition --task-definition "$APP_FAMILY" --query taskDefinition > app-task-definition.json
          aws ecs describe-task-definition --task-definition "$WORKER_FAMILY" --query taskDefinition > worker-task-definition.json

      - name: Render app task definition
        id: render-app
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: app-task-definition.json
          container-name: app
          image: ${{ steps.build.outputs.image }}
          environment-variables: |
            APP_VERSION=${{ github.sha }}

      - name: Render worker task definition
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: worker-task-definition.json
          container-name: worker
          image: ${{ steps.build.outputs.image }}
          environment-variables: |
            APP_VERSION=${{ github.sha }}

      - name: Deploy worker
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-worker.outputs.task-definition }}
          service: ${{ env.WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy app
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-app.outputs.task-definition }}
          service: ${{ env.APP_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
